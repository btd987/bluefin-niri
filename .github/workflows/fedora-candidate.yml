name: Fedora Candidate Validation

# No schedule, registry login, image upload, or publication. These are proof
# targets with pinned RPM trust, not boot/Secure Boot acceptance tests.
on:
  workflow_dispatch:
    inputs:
      signing_key_secret:
        description: "Name of an explicitly provisioned PEM module-signing key secret"
        required: true
        type: string
      signing_cert_secret:
        description: "Name of its base64-encoded DER certificate secret"
        required: true
        type: string
      rpm_signing_key_secret:
        description: "Name of an environment-scoped unencrypted armored OpenPGP private key secret"
        required: true
        type: string
      rpm_signing_fingerprint_variable:
        description: "Name of an environment-scoped variable holding the full uppercase signing fingerprint"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Administrators must configure required reviewers, prevent self-review,
    # restrict deployment to main, and provision environment-scoped secrets.
    environment: fedora-production-validation
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml
          # Noble's Just 1.21 lacks group and positional-arguments attributes.
          cargo install --locked --version 1.57.0 just --root "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just/bin" >> "$GITHUB_PATH"

      - name: Run standard unit tests
        run: |
          command -v just
          /usr/bin/python3 -c 'import yaml'
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Require supplied signing inputs
        env:
          SIGNING_KEY: ${{ secrets[inputs.signing_key_secret] }}
          SIGNING_CERT: ${{ secrets[inputs.signing_cert_secret] }}
          RPM_SIGNING_KEY: ${{ secrets[inputs.rpm_signing_key_secret] }}
          RPM_SIGNING_FINGERPRINT: ${{ vars[inputs.rpm_signing_fingerprint_variable] }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_CERT" || -z "$RPM_SIGNING_KEY" || ! "$RPM_SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]; then
            echo 'Explicit signing secrets are required; no test-key fallback.' >&2
            exit 1
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Build unpublished Fedora candidate
        env:
          SIGNING_KEY: ${{ secrets[inputs.signing_key_secret] }}
          SIGNING_CERT: ${{ secrets[inputs.signing_cert_secret] }}
          RPM_SIGNING_KEY: ${{ secrets[inputs.rpm_signing_key_secret] }}
          RPM_SIGNING_FINGERPRINT: ${{ vars[inputs.rpm_signing_fingerprint_variable] }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY" && -n "$SIGNING_CERT" && -n "$RPM_SIGNING_KEY" && "$RPM_SIGNING_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
          umask 077
          signing=$(mktemp -d "$RUNNER_TEMP/fedora-signing.XXXXXX")
          trap 'rm -rf -- "$signing"' EXIT
          printf '%s' "$SIGNING_KEY" > "$signing/key.pem"
          printf '%s' "$SIGNING_CERT" | base64 --decode > "$signing/cert.der"
          printf '%s' "$RPM_SIGNING_KEY" > "$signing/rpm-key.asc"
          unset SIGNING_KEY SIGNING_CERT RPM_SIGNING_KEY
          openssl pkey -in "$signing/key.pem" -passin pass: -noout
          openssl x509 -inform DER -in "$signing/cert.der" -noout
          podman build -f Containerfile.zfs --target zfs-rpms \
            --secret "id=zfs_signing_key,src=$signing/key.pem" \
            --secret "id=zfs_signing_cert,src=$signing/cert.der" \
            -t localhost/zfs-rpms:candidate .
          podman build --no-cache -f Containerfile.zfs-sign \
            --build-arg ZFS_RPM_IMAGE=localhost/zfs-rpms:candidate \
            --build-arg "ZFS_RPM_SIGNING_FINGERPRINT=$RPM_SIGNING_FINGERPRINT" \
            --secret "id=zfs_rpm_signing_key,src=$signing/rpm-key.asc" \
            -t localhost/zfs-signed-rpms:candidate .
          podman build --no-cache -f Containerfile.zfs-runtime \
            --build-arg ZFS_RPM_IMAGE=localhost/zfs-signed-rpms:candidate \
            --build-arg ZFS_RPM_TRUST_MODE=verified \
            --build-arg "ZFS_RPM_SIGNING_FINGERPRINT=$RPM_SIGNING_FINGERPRINT" \
            -t localhost/zfs-runtime:candidate .
          podman build -f Containerfile.nirius -t localhost/nirius-artifact:candidate .
          podman build -f Containerfile.fedora \
            --build-arg BASE_IMAGE=localhost/zfs-runtime:candidate \
            --build-arg NIRIUS_IMAGE=localhost/nirius-artifact:candidate \
            -t localhost/fedora-niri:candidate .
          printf '%s\n' \
            'Fedora candidate assembly completed on this runner; no image published or exported.' \
            'Containerfile checks are not boot, Secure Boot, storage, or update/rollback verification.' \
            'Pinned RPM signatures verified; protected credentials/enrollment and booted verification remain release gates.' \
            >> "$GITHUB_STEP_SUMMARY"
