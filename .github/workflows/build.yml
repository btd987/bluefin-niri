name: Build

on:
  pull_request:
  schedule:
    - cron: "0 5 * * TUE"  # Weekly stable (after upstream 1:00 UTC)
    - cron: "0 12 * * *"   # Daily stable-daily (midday to catch upstream updates)
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - stable-daily

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-yaml
          # Noble's Just 1.21 lacks group and positional-arguments attributes.
          cargo install --locked --version 1.57.0 just --root "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just/bin" >> "$GITHUB_PATH"

      - name: Run standard unit tests
        run: |
          command -v just
          /usr/bin/python3 -c 'import yaml'
          /usr/bin/python3 -m unittest discover -s tests -v

  build:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - base_image: ghcr.io/ublue-os/bluefin-dx
            image_name: bluefin-niri
            base_tag_stable: stable
            base_tag_daily: stable-daily
          - base_image: ghcr.io/ublue-os/bazzite
            image_name: bazzite-niri
            base_tag_stable: stable
            base_tag_daily: latest
          - base_image: ghcr.io/ublue-os/bazzite-nvidia
            image_name: bazzite-niri-nvidia
            base_tag_stable: stable
            base_tag_daily: latest

    steps:
      - name: Determine channel
        id: channel
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 5 * * TUE" ]]; then
              CHANNEL="stable"
            else
              CHANNEL="stable-daily"
            fi
          else
            # Push and pull request events validate stable-daily
            CHANNEL="stable-daily"
          fi
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          # Resolve upstream base tag (Bazzite uses 'latest' instead of 'stable-daily')
          if [[ "${CHANNEL}" == "stable" ]]; then
            echo "base_tag=${{ matrix.base_tag_stable }}" >> $GITHUB_OUTPUT
          else
            echo "base_tag=${{ matrix.base_tag_daily }}" >> $GITHUB_OUTPUT
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve base digest and version
        id: base_version
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          BASE_TAG: ${{ steps.channel.outputs.base_tag }}
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect "docker://${BASE_IMAGE}:${BASE_TAG}" | jq -er '
            .Digest | select(type == "string") |
            select(test("^sha256:[0-9a-f]{64}$") and length == 71)')
          BASE_REF="${BASE_IMAGE}@${DIGEST}"
          # Validate before shell substitution can strip trailing newlines.
          VERSION=$(skopeo inspect "docker://${BASE_REF}" | jq -er '
            .Labels["org.opencontainers.image.version"] | select(type == "string") |
            select(. != "null" and test("\\S") and (test("[[:cntrl:]]") | not))')
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate tags and version
        id: tags
        env:
          BASE_VERSION: ${{ steps.base_version.outputs.version }}
        run: |
          DATE=$(date +%Y%m%d)
          CHANNEL="${{ steps.channel.outputs.channel }}"

          echo "channel_tag=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "date_tag=${CHANNEL}-${DATE}" >> $GITHUB_OUTPUT

          # Determine variant suffix
          if [[ "${{ matrix.image_name }}" == *"-nvidia"* ]]; then
            SUFFIX="niri-nvidia"
          else
            SUFFIX="niri"
          fi

          # Compose version: base_version.suffix.date
          CUSTOM_VERSION="${BASE_VERSION}.${SUFFIX}.${DATE}"
          echo "custom_version=${CUSTOM_VERSION}" >> $GITHUB_OUTPUT

      - name: Build image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: ./Containerfile
          image: ${{ matrix.image_name }}
          tags: |
            ${{ steps.tags.outputs.channel_tag }}
            ${{ steps.tags.outputs.date_tag }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TAG=${{ steps.channel.outputs.base_tag }}
            BASE_REF=${{ steps.base_version.outputs.base_ref }}
            VARIANT=${{ matrix.image_name }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.custom_version }}
          oci: true

      - name: Export release image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ matrix.image_name }}
          CHANNEL_TAG: ${{ steps.tags.outputs.channel_tag }}
          DATE_TAG: ${{ steps.tags.outputs.date_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          podman save --format oci-archive --output "$RUNNER_TEMP/release/image.tar" "${IMAGE}:${CHANNEL_TAG}"
          printf '%s\n' "$CHANNEL_TAG" "$DATE_TAG" > "$RUNNER_TEMP/release/tags.txt"

      - name: Upload release image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image_name }}
          path: ${{ runner.temp }}/release/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image_name: [bluefin-niri, bazzite-niri, bazzite-niri-nvidia]
    steps:
      - name: Maximize publish space
        uses: ublue-os/remove-unwanted-software@v9

      # No checkout or image execution in the write-token job.
      - name: Download release image
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.image_name }}
          path: ${{ runner.temp }}/release/

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        env:
          IMAGE: ${{ matrix.image_name }}
        run: |
          set -euo pipefail
          while IFS= read -r TAG; do
            skopeo copy "oci-archive:$RUNNER_TEMP/release/image.tar" "docker://${IMAGE_REGISTRY}/${IMAGE}:${TAG}"
          done < "$RUNNER_TEMP/release/tags.txt"
